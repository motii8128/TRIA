syntax = "proto3";
package tria;

// Rust -> Pico2 (制御コマンド)
message CommandPacket {
  int32 horizontal_motor = 1;
  int32 vertical_motor = 2;
  int32 hand_motor = 3;
  int32 wheel1 = 4;
  int32 wheel2 = 5;
  int32 wheel3 = 6;
}


// Pico2 -> Rust (レスポンス)
message SensorPacket {
  int32 can_id = 1;
  int32 velocity = 2;
  int32 angle = 3;
  int32 torque = 4;

  int32 horizontal_limit_switch = 5;
  int32 vertical_limit_switch = 6;
}

// 足回りへの速度命令
message WheelVelocity {
  float x_velocity = 1;
  float y_velocity = 2;
  float rotation_velocity = 3;
}

// 点群とかに使う
message Point2D {
  float x = 1;
  float y = 2;
}

// ２次元点群
message PointCloud2D
{
  repeated Point2D points = 1;
}

// 位置の表現
message Position2D
{
  float x = 1;
  float y = 2;
  float theta = 3;
}